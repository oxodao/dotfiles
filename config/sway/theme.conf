# class                 border  background text    indicator child_border
client.focused          #6272A4 #6272A4 #F8F8F2 #6272A4 #6272A4
client.focused_inactive #44475A #44475A #F8F8F2 #44475A #44475A
client.unfocused        #282A36 #282A36 #BFBFBF #282A36 #282A36
client.urgent           #44475A #FF5555 #F8F8F2 #FF5555 #FF5555

# font pango:Hack Nerd Font 11
font pango:DepartureMono Nerd Font Regular 11

# Let Sway manage Waybar's lifecycle, including config reloads.
# NOTE: no ~ as waybar does not expand it, so use full path instead.
bar {
    swaybar_command /opt/dotfiles/config/scripts/start-waybar.sh
}
