# Focus an existing native Wayland or Xwayland window, otherwise launch it.
set $raise python3 ~/.config/sway/scripts/focus-or-launch.py
bindsym $mod+Return workspace $ws2; exec $raise '^Alacritty$' alacritty -e tmux new-session -A -s main
bindsym $mod+Shift+Return exec alacritty

bindsym $mod+space exec rofi -show combi -combi-modes "drun,run"
bindsym $mod+Ctrl+space exec rofi -modi emoji -show emoji
bindsym $mod+Mod1+space exec rofi -show calc

bindsym Mod1+space exec dunstctl close
bindsym Mod1+Shift+space exec dunstctl close-all

bindsym $mod+w workspace $ws1; exec firefox
bindsym $mod+y workspace $ws1; exec firefox https://youtube.com/
bindsym $mod+t workspace $ws8; exec $raise '^(crx_cifhbcnohmdccbgoicgdjpfamggdegmo|teams|teams-for-linux)$' teams
bindsym $mod+m workspace $ws10; exec $raise '^Spotify$' spotify-launcher
bindsym $mod+p workspace $ws9; exec bitwarden-desktop
bindsym $mod+e workspace $ws4; exec thunar

# Wait for key release before slurp acquires the keyboard.
bindsym --release Print exec sh ~/.config/sway/scripts/screenshot.sh region
bindsym --release Shift+Print exec sh ~/.config/sway/scripts/screenshot.sh full
bindsym --release $mod+s exec sh ~/.config/sway/scripts/screenshot.sh region
bindsym --release $mod+Shift+s exec sh ~/.config/sway/scripts/screenshot.sh full

# swaylock-effects provides screenshots and blur; fall back to plain swaylock.
bindsym $mod+Delete exec swaylock --screenshots --effect-blur 7x5 --color 262335 || swaylock --color 262335

bindcode $mod+62 exec playerctl pause
bindsym $mod+Left exec playerctl previous
bindsym $mod+Right exec playerctl next
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause

bindsym XF86MonBrightnessUp exec brightnessctl set +20%
bindsym XF86MonBrightnessDown exec brightnessctl set 20%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Explicit split direction without changing the existing i3 shortcuts.
bindsym $mod+v splitv
bindsym $mod+b splith
bindsym $mod+Shift+c reload
