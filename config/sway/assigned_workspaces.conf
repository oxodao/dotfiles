# Xwayland classes (same assignments as i3).
assign [class="(?i)^Firefox$"] $ws1
assign [class="(?i)^Alacritty$"] $ws2
assign [class="^(jetbrains-phpstorm|jetbrains-idea|code|Code)$"] $ws3
assign [class="Thunar"] $ws4
assign [class="^(jetbrains-datagrip|bruno)$"] $ws5
assign [class="(?i)^(Steam|Minecraft.*|com-skcraft-launcher-(Bootstrap|FancyLauncher)|lutris)$"] $ws6
assign [class="(?i)^(Slack|Mailspring|discord|Caprine|Skype|Signal|qTox|thunderbird|teams-for-linux|vesktop)$"] $ws8
assign [class="Google-chrome" instance="^crx_(cifhbcnohmdccbgoicgdjpfamggdegmo|faolnafnngnfdaknnbpnkhgohbobgegn)$"] $ws8
assign [class="(?i)^(keepassxc|bitwarden|notion-app|notion-app-enhanced)$"] $ws9
assign [class="(?i)^Spotify$"] $ws10
assign [class="VeraCrypt"] $ws11
assign [class="^(Vmware|VirtualBox.*)$"] $ws12

# Native Wayland applications use app_id rather than class.
assign [app_id="(?i)^(firefox|org.mozilla.firefox)$"] $ws1
assign [app_id="(?i)^Alacritty$"] $ws2
assign [app_id="(?i)^(jetbrains-phpstorm|jetbrains-idea|code|com.visualstudio.code)$"] $ws3
assign [app_id="(?i)^(thunar|org.xfce.thunar)$"] $ws4
assign [app_id="(?i)^(jetbrains-datagrip|bruno|com.usebruno.Bruno)$"] $ws5
assign [app_id="(?i)^(steam|lutris|net.lutris.Lutris|Minecraft.*|org.prismlauncher.PrismLauncher)$"] $ws6
assign [app_id="(?i)^(Slack|Mailspring|discord|Caprine|Skype|Signal|qTox|thunderbird|org.mozilla.Thunderbird|teams|teams-for-linux|vesktop)$"] $ws8
assign [app_id="(?i)^(keepassxc|org.keepassxc.KeePassXC|bitwarden|com.bitwarden.desktop|notion-app|notion-app-enhanced)$"] $ws9
assign [app_id="(?i)^(Spotify|com.spotify.Client)$"] $ws10
assign [app_id="(?i)^VeraCrypt$"] $ws11
assign [app_id="(?i)^(Vmware|VirtualBox.*)$"] $ws12

for_window [instance="^Devtools"] move container to workspace $ws4
for_window [class="Vmware"] border none
for_window [class="Notification Microsoft Teams"] floating enable
for_window [class="java-lang-Thread"] floating enable
for_window [class="jetbrains-.*" title="win0"] floating enable, border none
for_window [app_id="jetbrains-.*" title="win0"] floating enable, border none
for_window [title="Android Emulator.*"] floating enable, border none
for_window [title="Usage search.*"] floating enable, border none
for_window [class="jetbrains-datagrip" title="Parameters"] floating enable, resize set 400 300
for_window [app_id="jetbrains-datagrip" title="Parameters"] floating enable, resize set 400 300
for_window [window_type="dialog"] floating enable
for_window [window_role="^(pop-up|GtkFileChooserDialog)$"] floating enable
for_window [title="Ouvrir un dossier"] floating enable, resize set 800 600
