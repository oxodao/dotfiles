# Connector names from the existing Hyprland configuration.
# Check them with: swaymsg -t get_outputs
output DP-1 mode 1920x1080@60Hz position -1920 0 scale 1
output DP-3 mode 1920x1080@60Hz position 0 0 scale 1
output HDMI-A-1 mode 1920x1080@60Hz position 1920 0 scale 1

bindsym $mod+Home output DP-1 disable; output DP-3 disable; output HDMI-A-1 enable
bindsym $mod+Shift+Home output DP-1 enable; output DP-3 enable; output HDMI-A-1 enable
