exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland
exec gsettings set org.gnome.desktop.interface color-scheme prefer-dark

exec udiskie -a -t --appindicator
exec dunst
exec nm-applet --indicator
exec blueman-applet
exec syncthing --no-browser
exec kdeconnect-indicator
exec xdg-settings set default-web-browser firefox.desktop

# Provided by mate-polkit.
exec /usr/libexec/polkit-mate-authentication-agent-1
